<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CTF section — proposal</title>
<link rel="stylesheet" href="../css/fonts.css">
<script src="../js/icons.js"></script>
<style>
:root{--font:'Geist',system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,monospace;
  --bg:#f4f6fa;--side:#fff;--surface:#fff;--surface-2:#f8f9fc;--hover:#f1f4f9;--active:#e9edf6;--border:#dde3ec;--soft:#e9edf3;
  --text:#0f172a;--text-2:#475569;--text-3:#7b8798;--accent:#4f46e5;--accent-bg:#5b54f0;--accent-soft:#5b54f014;--accent-line:#5b54f040;
  --green:#15803d;--green-bg:#16a34a14;--red:#dc2626;--red-bg:#dc262612;--amber:#b45309;--amber-bg:#f59e0b18;
  --c-web:#2563eb;--c-crypto:#ca8a04;--c-for:#0d9488;--c-steg:#db2777;--c-osint:#7c3aed;--c-rev:#ea580c;--c-pwn:#dc2626;--c-net:#0891b2;--c-misc:#64748b;
  --sh:0 1px 2px #0f172a0d,0 1px 1px #0f172a08}
[data-theme=dark]{--bg:#0a0e17;--side:#0c111c;--surface:#111827;--surface-2:#141c2c;--hover:#192235;--active:#1f2a41;--border:#2a3550;--soft:#1e273b;
  --text:#e6eaf2;--text-2:#a3aec2;--text-3:#7a869c;--accent:#a5a1ff;--accent-bg:#6d64ff;--accent-soft:#6d64ff24;--accent-line:#6d64ff66;
  --green:#4ade80;--green-bg:#22c55e1a;--red:#f87171;--red-bg:#ef44441a;--amber:#fbbf24;--amber-bg:#f59e0b1f;--sh:0 1px 2px #0005}
*{box-sizing:border-box}
body{margin:0;background:#e5e8ee;font:14px/1.5 var(--font);color:var(--text)}
.i{width:16px;height:16px;stroke-width:1.8;flex:none}.i.sm{width:14px;height:14px}
.frame{width:1440px;height:900px;margin:0 auto 40px;display:grid;grid-template-columns:64px 1fr;background:var(--bg);overflow:hidden;position:relative}
.rail{background:var(--side);border-right:1px solid var(--soft);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
.rail .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#6d64ff,#a855f7);margin-bottom:12px}
.rail b{width:40px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--text-3)}.rail b.on{background:var(--accent-soft);color:var(--accent)}
.rail hr{width:32px;border:0;border-top:1px solid var(--soft);margin:6px 0}
.main{display:flex;flex-direction:column;min-width:0}
.top{height:56px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--soft)}
.search{width:560px;height:34px;border:1px solid var(--border);border-radius:8px;background:var(--surface);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--text-3);font-size:13.5px;box-shadow:var(--sh)}
.sp{flex:1}
.btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;gap:7px;font:500 13.5px var(--font);color:var(--text);box-shadow:var(--sh);white-space:nowrap}
.btn.pri{background:var(--accent-bg);border-color:var(--accent-bg);color:#fff}.btn.sm{height:28px;font-size:12.5px;padding:0 10px}.btn.ghost{border-color:transparent;box-shadow:none;background:none;color:var(--text-2)}
.page{padding:22px 32px 0;flex:1;display:flex;flex-direction:column;min-height:0}
.ph{display:flex;align-items:flex-end;gap:16px}
.ph h1{font-size:26px;letter-spacing:-.02em;margin:0;font-weight:600}.ph p{margin:4px 0 0;color:var(--text-2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--soft);margin-top:16px}
.tabs a{display:flex;align-items:center;gap:7px;padding:10px 12px;color:var(--text-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--text);border-color:var(--accent-bg)}.tabs a small{font:500 11.5px var(--mono);color:var(--text-3)}
.card{background:var(--surface);border:1px solid var(--soft);border-radius:12px;box-shadow:var(--sh)}
.caps{font-size:12px;color:var(--text-3);font-weight:500}
.mono{font-family:var(--mono)}
.cat{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--text-2)}
.cat i{width:8px;height:8px;border-radius:3px;background:var(--cc)}
.pill{height:22px;padding:0 8px;border-radius:6px;border:1px solid var(--soft);background:var(--surface-2);display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-2);font-weight:500}
.pill.g{color:var(--green);background:var(--green-bg);border-color:transparent}.pill.r{color:var(--red);background:var(--red-bg);border-color:transparent}.pill.a{color:var(--amber);background:var(--amber-bg);border-color:transparent}
.code{font:12.5px/1.6 var(--mono);background:var(--surface-2);border:1px solid var(--soft);border-radius:8px;padding:9px 12px;color:var(--text);white-space:pre;overflow:hidden}
.code .p{color:var(--text-3)}
.lbl{position:absolute;right:20px;bottom:16px;font:500 12px var(--mono);color:var(--text-3)}
/* frame 1 — challenge workspace */
.ws{display:grid;grid-template-columns:300px minmax(0,1fr) 340px;gap:20px;margin-top:18px;flex:1;min-height:0;padding-bottom:22px}
.col{display:flex;flex-direction:column;gap:14px;min-height:0}
.meta{padding:16px}.meta h2{margin:6px 0 4px;font-size:19px;letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:96px 1fr;gap:7px 10px;font-size:13px;margin-top:12px}.kv span{color:var(--text-3)}
.files{padding:12px}.file{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px}.file:hover{background:var(--hover)}
.file .fi{width:30px;height:30px;border-radius:8px;background:var(--surface-2);border:1px solid var(--soft);display:grid;place-items:center;color:var(--text-2)}
.file b{font-weight:500;font-size:13px;display:block}.file small{color:var(--text-3);font:11.5px var(--mono)}
.log{padding:0;display:flex;flex-direction:column;min-height:0;flex:1}
.loghd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--soft)}
.loghd h3{margin:0;font-size:14.5px}
.att{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:4px 12px;padding:12px 16px;border-bottom:1px solid var(--soft)}
.att .d{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.att .d.ok{background:var(--green-bg);color:var(--green)}.att .d.no{background:var(--red-bg);color:var(--red)}.att .d.mid{background:var(--amber-bg);color:var(--amber)}
.att p{margin:0;font-size:13.5px}.att .t{font:11.5px var(--mono);color:var(--text-3)}
.att .code{grid-column:2/4;margin-top:6px;padding:7px 10px}
.compose{margin:12px 16px 14px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.compose .in{color:var(--text-3);font-size:13.5px}.compose .row{display:flex;gap:6px;align-items:center}
.side h4{margin:0 0 10px;font-size:13.5px;display:flex;align-items:center;gap:8px}
.sug{padding:14px 16px}
.sg{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--soft)}.sg:first-of-type{border-top:0}
.sg .n{font:500 11px var(--mono);color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:1px 6px;height:18px;margin-top:2px}
.sg p{margin:0;font-size:13px}.sg .mono{font-size:12px;color:var(--text-2)}
.flagbox{padding:14px 16px}.flagin{height:36px;border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;padding:0 10px;font:13px var(--mono);gap:8px;background:var(--surface-2)}
.ok{color:var(--green)}
.ents{display:flex;flex-wrap:wrap;gap:6px}.ent{height:24px;border-radius:6px;border:1px solid var(--soft);padding:0 8px;display:inline-flex;align-items:center;gap:6px;font:12px var(--mono);background:var(--surface)}
.ent i{width:6px;height:6px;border-radius:50%;background:var(--cc)}
/* frame 2 — writeups */
.wl{display:grid;grid-template-columns:380px minmax(0,1fr);gap:20px;margin-top:18px;flex:1;min-height:0;padding-bottom:22px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{height:26px;padding:0 10px;border-radius:7px;border:1px solid var(--soft);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--text-2);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--text);color:var(--surface);border-color:var(--text)}
.wcard{padding:13px 14px;border-radius:10px;border:1px solid transparent;display:flex;flex-direction:column;gap:5px}
.wcard.on{background:var(--surface);border-color:var(--accent-line);box-shadow:var(--sh)}
.wcard h3{margin:0;font-size:14.5px;font-weight:600}.wcard p{margin:0;font-size:13px;color:var(--text-2)}
.wcard .m{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--text-3)}
.reader{padding:26px 34px;overflow:hidden;display:flex;flex-direction:column}
.reader h2{margin:8px 0 6px;font-size:24px;letter-spacing:-.02em}
.rmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tldr{margin:18px 0 6px;padding:12px 14px;background:var(--surface-2);border-radius:10px;font-size:13.5px;color:var(--text-2)}
.tldr b{color:var(--text)}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:14px;margin-top:16px}
.step{display:grid;grid-template-columns:28px 1fr;gap:12px}
.step .no{width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font:600 12.5px var(--mono);display:grid;place-items:center}
.step h4{margin:2px 0 4px;font-size:14.5px}.step p{margin:0 0 8px;color:var(--text-2);font-size:13.5px}
.rfoot{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:auto;padding-top:16px;border-top:1px solid var(--soft)}
.rfoot div{font-size:13px}.rfoot .caps{display:block;margin-bottom:5px}
.blur{filter:blur(4px)}
/* frame 3 — cheatsheets */
.cs{display:grid;grid-template-columns:230px minmax(0,1fr) 320px;gap:20px;margin-top:18px;flex:1;min-height:0;padding-bottom:22px}
.nav{padding:8px}.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-weight:500;font-size:13.5px;color:var(--text-2)}
.nav a.on{background:var(--active);color:var(--text)}.nav a small{margin-left:auto;font:11.5px var(--mono);color:var(--text-3)}
.nav a i{width:9px;height:9px;border-radius:3px;background:var(--cc)}
.sect h3{margin:0 0 2px;font-size:16px}.sect>p{margin:0 0 12px;color:var(--text-2);font-size:13.5px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:12px;font-weight:500;color:var(--text-3);text-align:left;padding:9px 14px;background:var(--surface-2);border-bottom:1px solid var(--soft)}
td{padding:9px 14px;border-bottom:1px solid var(--soft);vertical-align:top}tr:last-child td{border-bottom:0}
td.mono{font-size:12.5px;white-space:nowrap}
.cmdgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.cmd{padding:11px 12px}.cmd b{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}.cmd .code{margin-top:7px;padding:7px 10px;font-size:12px}
.tip{padding:14px 16px}.tip ul{margin:6px 0 0;padding-left:18px;color:var(--text-2);font-size:13px}.tip li{margin:6px 0}
.fm{padding:14px 16px}.fm ol{margin:8px 0 0;padding-left:0;list-style:none;counter-reset:f}
.fm li{counter-increment:f;display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--soft);font-size:13px}.fm li:first-child{border-top:0}
.fm li::before{content:counter(f);font:600 11.5px var(--mono);color:var(--text-3);width:16px}
.fm li .cb{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--border);margin-top:2px;flex:none}.fm li.done .cb{background:var(--accent-bg);border-color:var(--accent-bg)}
.fm li.done span{color:var(--text-3);text-decoration:line-through}
</style>
</head>
<body>
<div id="root"></div>
<script>
const I = (n, c='') => `<svg class="i ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${LUCIDE[n]||''}</svg>`;
const shell = (inner, lbl) => `<section class="frame"><nav class="rail"><div class="logo"></div>${['layout-dashboard','sticky-note','notebook-pen'].map(i=>`<b>${I(i)}</b>`).join('')}<hr>${['folder-open'].map(i=>`<b>${I(i)}</b>`).join('')}<hr>${['wrench','scan-search','file-search','binary','cloud'].map(i=>`<b>${I(i)}</b>`).join('')}<b class="on">${I('flag')}</b>${['book-open','list-checks'].map(i=>`<b>${I(i)}</b>`).join('')}</nav>
  <div class="main"><div class="top"><div class="search">${I('search')}Search everything — cases, evidence, IOCs, tools, notes…</div><span class="sp"></span><button class="btn pri">${I('plus')}Capture</button></div>
  <div class="page">${inner}</div></div><div class="lbl">${lbl}</div></section>`;
const head = (on, extra='') => `<div class="ph"><div><h1>CTF</h1><p>Solve challenges with a work log, keep write-ups, and have the right cheatsheet open while you work.</p></div><span class="sp"></span>${extra}</div>
  <div class="tabs">${[['Challenges','flag',6],['Write-ups','scroll-text',14],['Cheatsheets','book-open',9],['First moves','list-checks',9]].map(([n,i,c],k)=>`<a class="${k===on?'on':''}">${I(i,'sm')}${n}<small>${c}</small></a>`).join('')}</div>`;

/* 1 — challenge workspace */
const f1 = head(0, `<button class="btn">${I('arrow-right','sm')}Back to board</button><button class="btn pri">${I('scroll-text','sm')}Turn into write-up</button>`) + `
<div class="ws">
  <div class="col">
    <div class="card meta"><span class="cat" style="--cc:var(--c-steg)"><i></i>Stego · Sample CTF 2026</span><h2>Hidden layers</h2>
      <p style="margin:0;color:var(--text-2);font-size:13.5px">“Not everything in this picture is a picture.”</p>
      <div class="kv"><span>Points</span><b class="mono">200</b><span>Status</span><span><span class="pill a">Working · 38 min</span></span><span>Flag format</span><b class="mono">FLAG{…}</b><span>Difficulty</span><span>Medium</span><span>Linked case</span><a style="color:var(--accent)" class="mono">LAB-2026-02</a></div></div>
    <div class="card files"><div class="caps" style="padding:2px 8px 6px">Files</div>
      <div class="file"><span class="fi">${I('image','sm')}</span><div><b>layers.png</b><small>PNG · 1.2 MB · sha256 9f2c…a1</small></div></div>
      <div class="file"><span class="fi">${I('binary','sm')}</span><div><b>after_iend.bin</b><small>carved · 48 KB · zip</small></div></div>
      <div class="file"><span class="fi">${I('file-text','sm')}</span><div><b>notes.txt</b><small>from tEXt chunk</small></div></div></div>
    <div class="card" style="padding:14px 16px"><div class="side"><h4>${I('fingerprint','sm')}Found in this challenge</h4></div>
      <div class="ents"><span class="ent" style="--cc:#0891b2"><i></i>k3lpie_sails</span><span class="ent" style="--cc:#7c3aed"><i></i>pastebin.com/u/k3lp</span><span class="ent" style="--cc:#ca8a04"><i></i>zip pw: harbour</span></div></div>
  </div>
  <div class="card log">
    <div class="loghd">${I('terminal')}<h3>Work log</h3><span class="pill">6 tries</span><span class="sp"></span><button class="btn sm ghost">${I('copy','sm')}Copy as markdown</button></div>
    <div class="att"><span class="d ok">${I('check','sm')}</span><p>File inspector: PNG is valid, but 48 KB of data sits after <b class="mono">IEND</b></p><span class="t">14:02</span><div class="code"><span class="p">$</span> binwalk -e layers.png   <span class="p"># Zip archive at 0x12A3F0</span></div></div>
    <div class="att"><span class="d ok">${I('check','sm')}</span><p>tEXt chunk holds a comment: “the password is where she docks”</p><span class="t">14:06</span><div class="code"><span class="p">$</span> exiftool -a -G1 layers.png | grep -i comment</div></div>
    <div class="att"><span class="d no">${I('x','sm')}</span><p>zsteg on all channels — nothing readable, only noise in b1,rgb</p><span class="t">14:11</span><div class="code"><span class="p">$</span> zsteg -a layers.png</div></div>
    <div class="att"><span class="d no">${I('x','sm')}</span><p>Zip password guesses from rockyou — no hit after 2 min</p><span class="t">14:19</span><div class="code"><span class="p">$</span> zip2john after_iend.zip &gt; h; john h --wordlist=rockyou.txt</div></div>
    <div class="att"><span class="d mid">${I('lightbulb','sm')}</span><p>Idea: “where she docks” → the harbour from <i>Harbour lights</i>. Try <b class="mono">harbour</b> and the town name.</p><span class="t">14:24</span></div>
    <div class="compose"><div class="in">What did you try, and what happened? Paste output — indicators are pulled out for you.</div>
      <div class="row"><button class="btn sm">${I('check','sm')}Worked</button><button class="btn sm">${I('x','sm')}Dead end</button><button class="btn sm">${I('lightbulb','sm')}Idea</button><span class="sp"></span><button class="btn sm pri">Add to log</button></div></div>
  </div>
  <div class="col side">
    <div class="card sug"><h4>${I('sparkles','sm')}Next moves for a stego PNG</h4>
      <div class="sg"><span class="n">1</span><div><p>Check every chunk, not just IEND</p><div class="mono">pngcheck -vtp7 layers.png</div></div></div>
      <div class="sg"><span class="n">2</span><div><p>Look at bit planes visually</p><div class="mono">Image tools → Bit planes</div></div></div>
      <div class="sg"><span class="n">3</span><div><p>Crack the carved zip with a themed list</p><div class="mono">john --wordlist=words.txt h</div></div></div>
      <div class="sg"><span class="n">4</span><div><p>Fix a wrong height in IHDR to reveal hidden rows</p><div class="mono">Decoder → Hex edit</div></div></div>
      <button class="btn sm ghost" style="margin-top:6px;padding:0">${I('book-open','sm')}Open the Stego cheatsheet</button></div>
    <div class="card flagbox"><h4 style="margin:0 0 10px;font-size:13.5px;display:flex;gap:8px;align-items:center">${I('flag','sm')}Flag</h4>
      <div class="flagin">FLAG{l4y3rs_0f_th3_h4rb0ur}<span class="sp"></span><span class="ok">${I('check','sm')}</span></div>
      <p style="margin:8px 0 0;font-size:12.5px;color:var(--text-3)">Matches the event’s flag format. Mark solved to move it to Solved and draft the write-up.</p>
      <button class="btn pri" style="margin-top:10px;width:100%;justify-content:center">${I('trophy','sm')}Mark solved · +200</button></div>
  </div>
</div>`;

/* 2 — write-ups */
const wl = [['Hidden layers','Data after IEND, password in a tEXt comment, zip cracked with a themed list.','--c-steg','Stego','Sample CTF 2026','Mine',1],
 ['Rot in peace','ROT13 then base64 — recognised by the alphabet and = padding.','--c-crypto','Crypto','Sample CTF 2026','Mine'],
 ['Who registered it?','Historical WHOIS and a reused e-mail across three domains.','--c-osint','OSINT','Sample CTF 2026','Mine'],
 ['Memory lane','Volatility 3: malfind on a hollowed svchost, flag in the injected PE.','--c-for','Forensics','Practice','Imported'],
 ['Packet whisper','DNS exfiltration: base32 labels reassembled from tshark output.','--c-net','Network','Practice','Imported'],
 ['Cookie monster','Signed Flask session forged after finding the secret key in .git.','--c-web','Web','Practice','Imported']];
const f2 = head(1, `<button class="btn">${I('upload','sm')}Import markdown</button><button class="btn">${I('download','sm')}Export all</button><button class="btn pri">${I('plus','sm')}New write-up</button>`) + `
<div class="wl">
  <div style="display:flex;flex-direction:column;min-height:0">
    <div class="search" style="width:100%;margin-bottom:10px">${I('search')}Search write-ups, tools, techniques…</div>
    <div class="filters"><span class="chip on">All 14</span><span class="chip">Mine 8</span><span class="chip">Imported 6</span><span class="chip">${I('filter','sm')}Category</span><span class="chip">Event</span></div>
    ${wl.map(([t,p,c,n,e,o,on])=>`<div class="wcard${on?' on':''}"><span class="cat" style="--cc:var(${c})"><i></i>${n}</span><h3>${t}</h3><p>${p}</p><div class="m"><span>${e}</span><span>·</span><span>${o}</span></div></div>`).join('')}
  </div>
  <div class="card reader">
    <div class="rmeta"><span class="cat" style="--cc:var(--c-steg)"><i></i>Stego</span><span class="pill">Sample CTF 2026</span><span class="pill">200 pts</span><span class="pill g">${I('check','sm')}Solved in 46 min</span><span class="sp"></span><button class="btn sm">${I('pencil','sm')}Edit</button><button class="btn sm">${I('download','sm')}Markdown</button></div>
    <h2>Hidden layers</h2>
    <div class="tldr"><b>TL;DR</b> — a zip was appended after the PNG’s IEND chunk. The tEXt comment hinted at the password (“where she docks”), which was the harbour from an earlier challenge.</div>
    <div class="steps">
