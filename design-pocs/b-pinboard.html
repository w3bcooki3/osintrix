<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Osintrix POC B · Pinboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#121A21;--surface:#1B2731;--raise:#223240;--line:#2F4251;--text:#DCE6EC;--muted:#8FA3B1;--sel:#F4B740;--mal:#FF6B6B;--ok:#49C6A8;--sus:#E9A23B;--unk:#8FA3B1;--int:#6E8BFF;
--sans:'Barlow',system-ui,sans-serif;--cond:'Barlow Semi Condensed','Barlow',sans-serif}
:root[data-theme=light]{--bg:#E9EEF1;--surface:#FFFFFF;--raise:#F3F6F8;--line:#C7D2DA;--text:#14222C;--muted:#5A6D7A;--sel:#C98A00;--mal:#D33A3A;--ok:#1E8E73;--sus:#B87400;--unk:#6B7F8C;--int:#3F5FD9}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.45 var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px;border-radius:4px}
svg#board{position:fixed;inset:0;width:100%;height:100%;
  background-image:radial-gradient(circle,var(--line) 1px,transparent 1.2px);background-size:28px 28px}
/* top bar floats over canvas */
.top{position:fixed;top:14px;left:14px;right:14px;display:flex;gap:10px;align-items:center;pointer-events:none}
.top>*{pointer-events:auto}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;gap:4px;padding:5px}
.case{padding:4px 10px 4px 6px;gap:10px}
.case .dot{width:26px;height:26px;border-radius:7px;background:var(--sel);display:grid;place-items:center;color:#1b1300;font-weight:700;font-size:13px}
.case b{font-weight:600}
.case small{color:var(--muted);font-family:var(--cond);font-size:13px;margin-left:6px}
.seg button{padding:5px 11px;border-radius:7px;color:var(--muted);font-weight:500}
.seg button[aria-pressed=true]{background:var(--raise);color:var(--text)}
.find{flex:1;max-width:420px;padding:0 12px;height:42px}
.find input{flex:1;background:none;border:0;color:var(--text);font:inherit;outline:none}
.find kbd,.k{font:600 11px var(--cond);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.sp{flex:1}
.cap{background:var(--sel);color:#1b1300;font-weight:700;padding:10px 16px;border-radius:9px}
/* node labels */
.n circle.ring{fill:var(--surface);stroke-width:2.5}
.n text{font:600 13px var(--cond);fill:var(--text);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.n text.kind{font:700 11px var(--cond);fill:var(--muted);stroke:none}
.n{cursor:pointer;transition:opacity .25s}
.n.fade,.e.fade{opacity:.3}
.n.off,.e.off,.n.off.fade,.e.off.fade{opacity:0;pointer-events:none}
.e line{stroke:var(--line);stroke-width:1.6}
.e.stated line{stroke:var(--muted)}
.e text{font:500 11px var(--cond);fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.e.x line{stroke:var(--mal);stroke-dasharray:5 5}
.sel-halo{fill:none;stroke:var(--sel);stroke-width:2;stroke-dasharray:3 5}
/* radial */
.radial{position:fixed;width:0;height:0;pointer-events:none}
.radial button{position:absolute;transform:translate(-50%,-50%);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:600 13px var(--cond);white-space:nowrap;pointer-events:auto;box-shadow:0 6px 18px rgba(0,0,0,.35);opacity:0;transition:opacity .18s, transform .18s}
.radial.on button{opacity:1}
.radial button:hover{border-color:var(--sel);color:var(--sel)}
.radial button.danger{color:var(--mal)}
/* card */
.card{position:fixed;right:14px;top:72px;width:330px;max-height:calc(100% - 200px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card .kind{font:600 12px var(--cond);color:var(--muted)}
.card h2{margin:2px 0 10px;font-size:19px;font-weight:600;word-break:break-all;line-height:1.25}
.vd{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--cond);padding:3px 9px;border-radius:6px;border:1px solid}
.card h3{font:600 13px var(--cond);color:var(--muted);margin:16px 0 6px}
.card ul{list-style:none;margin:0;padding:0}
.card li{padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.card li small{display:block;color:var(--muted);font-family:var(--cond)}
.warn{margin-top:12px;border-radius:8px;padding:9px 11px;background:color-mix(in srgb,var(--mal) 14%,transparent);border:1px solid color-mix(in srgb,var(--mal) 45%,transparent);font-size:14px}
/* legend */
.legend{position:fixed;left:14px;bottom:96px;padding:10px 12px;flex-direction:column;align-items:flex-start;gap:6px;font:500 13px var(--cond)}
.legend span{display:flex;gap:8px;align-items:center}
.legend i{width:10px;height:10px;border-radius:50%;border:2.5px solid}
/* scrubber */
.scrub{position:fixed;left:14px;right:14px;bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.play{width:36px;height:36px;border-radius:50%;background:var(--raise);display:grid;place-items:center}
.track{position:relative;height:44px}
.ticks{position:absolute;inset:0 0 18px 0}
.ticks i{position:absolute;bottom:0;width:3px;border-radius:2px;background:var(--muted)}
.ticks i.m{background:var(--mal)}
.track input{position:absolute;left:0;right:0;bottom:0;width:100%;accent-color:var(--sel)}
.when{font:600 14px var(--cond);min-width:150px;text-align:right}
.when small{display:block;color:var(--muted);font-weight:500}
@media (max-width:820px){.card{left:10px;right:10px;width:auto;top:auto;bottom:96px;max-height:40vh}.legend,.find,.seg{display:none}.when{min-width:0}.radial button{font-size:12px;padding:5px 9px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg id="board" role="img" aria-label="Link graph for Op Lantern"></svg>
<div class="top">

  <div class="pill find"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Find on the board, or paste an indicator" aria-label="Find on the board"><kbd>/</kbd></div>

 '9f2c1d0b7e4a6c8f3b5d2e1a0c9b8f7e6d5c4b3a2f1e0d9c8b7a6f5e4d3c2b1a':{k:'hash',v:'malicious'},
 '203.0.113.47':{k:'ip',v:'malicious',x:['Customer portal — 212 failed logins, 10 Sep']},

function sightings(ioc){return RECS.filter(r=>(r.body+' '+r.title).includes(ioc)).map(r=>r.id);}
function markup(text,esc){ // wrap known indicators, longest first
  const keys=Object.keys(IOC).sort((a,b)=>b.length-a.length);
  let out='',i=0;
  while(i<text.length){let hit=null;for(const k of keys){if(text.startsWith(k,i)){hit=k;break}}
    if(hit){out+=`<mark class="ioc v-${IOC[hit].v}" data-ioc="${esc(hit)}" tabindex="0">${esc(hit)}</mark>`;i+=hit.length}else{out+=esc(text[i]);i++}}

let sel='h', asOf=Infinity;
const tMin=Math.min(...N.map(n=>n.t)), tMax=Math.max(...N.map(n=>n.t));
function layout(){const W=innerWidth,H=innerHeight, w=Math.min(W-(W>820?400:40),1100), h=H-240;
  const ox=W>820?40:20, oy=90; N.forEach(n=>{n.px=ox+n.x/1000*w; n.py=oy+n.y/620*h});}

  c.innerHTML=`<div class="kind">${esc(n.k)}</div><h2>${esc(n.l)}</h2><span class="vd" style="color:${COL[n.v]};border-color:${COL[n.v]}">● ${VLAB[n.v]}</span>
   ${n.id==='h'?`<div class="warn" style="background:color-mix(in srgb,var(--sel) 14%,transparent);border-color:color-mix(in srgb,var(--sel) 50%,transparent)"><b>Look at this next.</b> Not judged yet, but linked to three malicious items: the sender domain, Lamp loader and the payment wallet.</div>`:''}
   ${n.id==='c2'?`<div class="warn"><b>Crosses cases.</b> The same IP ran 212 failed logins against the customer portal on 10 Sep.</div>`:''}
   <h3>Connections</h3><ul>${links}</ul>
   ${recs.length?`<h3>From the evidence</h3><ul>${recs.map(r=>`<li>${esc(r.title)}<small>${r.t.slice(5,16)} · ${esc(r.src)}</small></li>`).join('')}</ul>`:''}
   <h3>Added</h3><p style="margin:0;color:var(--muted);font-family:var(--cond)">${new Date(n.t).toUTCString().slice(5,22)} UTC</p>`;}
function ticks(){document.getElementById('ticks').innerHTML=N.map(n=>`<i class="${n.v==='mal'?'m':''}" style="left:${(n.t-tMin)/(tMax-tMin)*100}%;height:${10+(n.v==='mal'?14:6)}px"></i>`).join('');}
function setT(v){asOf=v>=100?Infinity:tMin+(tMax-tMin)*v/100; const shown=N.filter(n=>n.t<=asOf).length;
  document.getElementById('when').innerHTML=(v>=100?'Everything':new Date(asOf).toUTCString().slice(5,22))+`<small>${shown} of ${N.length} on the board</small>`; draw();}
document.getElementById('t').oninput=e=>setT(+e.target.value);
svg.addEventListener('click',e=>{const g=e.target.closest('.n'); sel=g?(sel===g.dataset.id?null:g.dataset.id):null; draw();});
svg.addEventListener('keydown',e=>{if(e.key==='Enter'){const g=e.target.closest('.n'); if(g){sel=g.dataset.id;draw();}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){sel=null;draw()} if(e.key==='/'&&e.target.tagName!=='INPUT'){e.preventDefault();document.getElementById('q').focus()}});
document.getElementById('q').oninput=e=>{const q=e.target.value.toLowerCase(); const m=N.find(n=>q&&n.l.toLowerCase().includes(q)); if(m){sel=m.id;draw()}};
let timer=null; document.getElementById('play').onclick=()=>{const r=document.getElementById('t'); if(timer){clearInterval(timer);timer=null;return} r.value=0; setT(0);
  timer=setInterval(()=>{r.value=Math.min(100,+r.value+2); setT(+r.value); if(+r.value>=100){clearInterval(timer);timer=null}},80)};
document.getElementById('themeB').onclick=()=>{const h=document.documentElement; h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'};
addEventListener('resize',draw);
ticks(); setT(100);
</script>
</body>
