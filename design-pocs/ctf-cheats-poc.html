<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CTF cheatsheets and write-ups — proposals</title>
<link rel="stylesheet" href="../css/fonts.css">
<script src="../js/icons.js"></script>
<script src="../js/data/ctf-cheats.js"></script>
<style>
:root{--font:'Geist',system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,monospace;
  --bg:#f4f6fb;--side:#fff;--surface:#fff;--surface-2:#f6f8fc;--hover:#eef2fa;--border:#dfe5f0;--soft:#eaeef6;
  --text:#101828;--text-2:#475467;--text-3:#5f6b80;--accent:#3b5bdb;--accent-bg:#4f5df0;--accent-soft:#3b5bdb12;--accent-line:#3b5bdb4d;
  --green:#0b7a52;--green-soft:#12b88614;--red:#c92a3a;--amber:#a35c00;--sh:0 1px 2px #1018280d}
[data-theme=dark]{--bg:#0b1020;--side:#0e1426;--surface:#131a2e;--surface-2:#182139;--hover:#1d2742;--border:#243052;--soft:#1b2440;
  --text:#eef2fb;--text-2:#b7c2da;--text-3:#8995b0;--accent:#8aa2ff;--accent-bg:#5470f5;--accent-soft:#7d97ff1f;--accent-line:#7d97ff55;
  --green:#4fd6a2;--green-soft:#4fd6a21a;--red:#ff7f8a;--amber:#f7b955;--sh:0 1px 2px #0006}
*{box-sizing:border-box}
body{margin:0;background:#dfe3ea;font:14.5px/1.5 var(--font);color:var(--text);padding:30px 0}
.i{width:16px;height:16px;stroke-width:1.8;flex:none}.i.sm{width:14px;height:14px}
.frame{width:1440px;height:900px;margin:0 auto 46px;display:grid;grid-template-columns:64px 1fr;background:var(--bg);overflow:hidden;position:relative;border-radius:10px;box-shadow:0 20px 60px -20px #0f172a55}
.rail{background:var(--side);border-right:1px solid var(--soft);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
.rail .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#6d64ff,#a855f7);margin-bottom:12px}
.rail b{width:40px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--text-3)}.rail b.on{background:var(--accent-soft);color:var(--accent)}
.rail hr{width:32px;border:0;border-top:1px solid var(--soft);margin:6px 0}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--soft)}
.search{width:600px;height:40px;border:1px solid var(--border);border-radius:11px;background:var(--surface);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--text-3)}
.sp{flex:1}
.btn{height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;gap:8px;font:500 14px var(--font);color:var(--text);box-shadow:var(--sh);white-space:nowrap}
.btn.pri{background:var(--accent-bg);border-color:var(--accent-bg);color:#fff}.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.on{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent)}
.page{padding:24px 32px 0;flex:1;display:flex;flex-direction:column;min-height:0}
.ph{display:flex;align-items:flex-end;gap:12px}
.ph h1{margin:0;font-size:27px;letter-spacing:-.025em;font-weight:680}.ph p{margin:4px 0 0;color:var(--text-2);font-size:15px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--soft);margin-top:14px;flex:none}
.tabs a{display:flex;align-items:center;gap:7px;padding:10px 12px;color:var(--text-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--text);border-color:var(--accent-bg)}.tabs a small{font:500 12px var(--mono);color:var(--text-3)}
.mono{font-family:var(--mono)}
.card{background:var(--surface);border:1px solid var(--soft);border-radius:14px;box-shadow:var(--sh)}
.lbl{position:absolute;right:20px;bottom:14px;font:500 12px var(--mono);color:var(--text-3);background:var(--surface);padding:4px 8px;border-radius:6px;border:1px solid var(--soft);z-index:9}
.dot{width:8px;height:8px;border-radius:3px;background:var(--cc);flex:none;display:inline-block}
.ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--cc);background:color-mix(in srgb,var(--cc) 13%,transparent);flex:none}
.inp{height:38px;border:1px solid var(--border);border-radius:10px;background:var(--surface);display:flex;align-items:center;gap:9px;padding:0 12px;color:var(--text-3);font-size:14px}
.inp.big{height:42px}
kbd{font:500 11.5px var(--mono);border:1px solid var(--border);border-radius:5px;padding:1px 6px;color:var(--text-3);background:var(--surface-2)}
.ut{display:flex;gap:2px;border-bottom:1px solid var(--soft)}
.ut span{display:flex;align-items:center;gap:7px;padding:9px 12px;font-weight:500;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14px}
.ut span.on{color:var(--text);border-color:var(--text)}.ut small{font:500 11.5px var(--mono);color:var(--text-3)}
/* the command table, shared */
.tbl{overflow:hidden}
.gh{padding:9px 16px;font:600 12px var(--font);letter-spacing:.04em;text-transform:uppercase;color:var(--text-3);background:var(--surface-2);border-top:1px solid var(--soft);display:flex;gap:8px;align-items:center}
.gh:first-child{border-top:0}.gh small{font:500 11px var(--mono);letter-spacing:0}
.row{display:grid;grid-template-columns:230px minmax(0,1fr) 28px;gap:14px;align-items:center;padding:10px 16px;border-top:1px solid var(--soft);font-size:14px}
.gh+.row{border-top:1px solid var(--soft)}
.row code{font:13.5px/1.5 var(--mono);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row code b{font-weight:500;color:var(--green);background:var(--green-soft);border-radius:4px;padding:0 3px}
.row code b.phv{color:var(--amber);background:#f59e0b17}
.row .cp{color:var(--text-3);opacity:0}.row.hov{background:var(--hover)}.row.hov .cp{opacity:1}
/* ---------- A ---------- */
.a-bar{display:flex;gap:10px;align-items:center;margin:18px 0 0;flex:none}
.catpick{height:42px;padding:0 12px 0 8px;border-radius:11px;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;gap:10px;font-weight:600;box-shadow:var(--sh)}
.catpick small{font:500 12px var(--mono);color:var(--text-3)}
.vals{height:42px;padding:0 12px;border-radius:11px;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;gap:9px;font-size:14px;box-shadow:var(--sh);white-space:nowrap}
.vals .tok{font:500 13px var(--mono);color:var(--green);background:var(--green-soft);padding:2px 7px;border-radius:6px}
.vals small{color:var(--text-3)}
.a-sub{display:flex;align-items:flex-end;gap:16px;margin-top:14px;flex:none}
.a-sub p{margin:0 0 9px;color:var(--text-3);font-size:13.5px;text-align:right;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-body{display:grid;grid-template-columns:190px minmax(0,1fr);gap:22px;margin-top:16px;min-height:0;flex:1}
.toc{display:flex;flex-direction:column;gap:1px;font-size:14px}
.toc .h{font-size:12px;color:var(--text-3);font-weight:500;padding:0 10px 6px}
.toc span{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-radius:8px;color:var(--text-2)}
.toc span small{font:500 11.5px var(--mono);color:var(--text-3)}
.toc span.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:inset 2px 0 0 var(--accent-bg)}
.pop{position:absolute;z-index:5;width:460px;padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--border);box-shadow:0 18px 50px -12px #10182840,0 2px 6px #1018280f}
.pop h4{margin:0 0 2px;font-size:15px}.pop p{margin:0 0 12px;color:var(--text-3);font-size:13px}
.pop .f{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 12px;align-items:center;font-size:13.5px;color:var(--text-2)}
.pop .f div{height:36px;border:1px solid var(--border);border-radius:9px;display:flex;align-items:center;padding:0 11px;font:13.5px var(--mono);color:var(--text-3)}
.pop .f div.set{color:var(--text);border-color:var(--green)}
.pop .ft{display:flex;justify-content:space-between;margin-top:14px;align-items:center;font-size:13px;color:var(--text-3)}
.drawer-tab{display:inline-flex;align-items:center;gap:8px}
.drawer-tab .pr{width:46px;height:5px;border-radius:5px;background:var(--soft);overflow:hidden}.drawer-tab .pr i{display:block;height:100%;width:0;background:var(--accent-bg)}
/* ---------- B ---------- */
.b-wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;margin-top:18px;min-height:0;flex:1}
.tree{padding:6px;display:flex;flex-direction:column;align-self:start}
.tree .c{display:flex;align-items:center;gap:10px;height:42px;padding:0 10px;border-radius:9px;font-size:14.5px;font-weight:600;color:var(--text);border-top:1px solid var(--soft)}
.tree .c:first-child,.tree .c.on,.tree .c.on+.kids+.c{border-top-color:transparent}
.tree .c .i{color:var(--text-3)}
.tree .c small{margin-left:auto;font:500 12.5px var(--mono);color:var(--text-3)}
.tree .c.on{background:var(--accent-soft);color:var(--accent)}.tree .c.on .i,.tree .c.on small{color:var(--accent)}
.tree .kids{margin:4px 0 6px 18px;padding-left:12px;border-left:1px solid var(--soft);display:flex;flex-direction:column}
.tree .kids span{display:flex;justify-content:space-between;padding:6px 10px;border-radius:7px;font-size:14px;color:var(--text-2)}
.tree .kids span.on{color:var(--text);font-weight:600;background:var(--hover)}
.tree .kids small{font:500 12px var(--mono);color:var(--text-3)}
.b-main{display:flex;flex-direction:column;min-height:0;gap:12px}
.b-head{display:flex;gap:10px;align-items:center}
.env{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;padding:6px 6px 6px 12px;border:1px solid var(--soft);background:var(--surface);border-radius:11px;font-size:13px;color:var(--text-3);overflow:hidden}
.env .k{display:inline-flex;align-items:center;height:28px;border-radius:7px;border:1px dashed var(--border);font:13px var(--mono);overflow:hidden}
.env .k em{font-style:normal;padding:0 7px;color:var(--text-3);background:var(--surface-2);height:100%;display:flex;align-items:center;border-right:1px dashed var(--border)}
.env .k span{padding:0 8px;color:var(--text-3)}
.env .k.set{border-style:solid;border-color:color-mix(in srgb,var(--green) 45%,transparent)}.env .k.set em{border-right-style:solid;border-color:inherit}.env .k.set span{color:var(--green);font-weight:500}
/* ---------- C ---------- */
.c-bar{display:flex;align-items:center;gap:10px;margin-top:16px;flex:none}
.cats{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2);border:1px solid var(--soft);flex:none}
.cats span{height:34px;padding:0 11px;border-radius:9px;display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500;color:var(--text-2)}
.cats span.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px #0000001a,0 0 0 1px var(--border)}
.cats span i{width:8px;height:8px;border-radius:50%;background:var(--cc)}
.c-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;margin-top:14px;min-height:0;flex:1}
.mas{columns:2;column-gap:16px}
.gcard{break-inside:avoid;margin-bottom:16px;overflow:hidden}
.gcard h5{margin:0;padding:11px 14px;font-size:14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--soft)}
.gcard h5 small{font:500 11.5px var(--mono);color:var(--text-3);margin-left:auto}
.gcard .r{padding:8px 14px;border-top:1px solid var(--soft)}.gcard h5+.r{border-top:0}
.gcard .r span{display:block;font-size:12.5px;color:var(--text-3)}
.gcard .r code{display:block;font:13px/1.55 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .r code b{font-weight:500;color:var(--green);background:var(--green-soft);border-radius:4px;padding:0 3px}
.fmc{padding:14px 16px;align-self:start}
.fmc h4{margin:0 0 8px;font-size:14.5px;display:flex;align-items:center;gap:8px}.fmc h4 small{margin-left:auto;font:500 12px var(--mono);color:var(--text-3)}
.fmc li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--soft);font-size:13.5px;color:var(--text-2);line-height:1.45}
.fmc li:first-child{border-top:0}.fmc ol{list-style:none;margin:0;padding:0}
.fmc li i{width:16px;height:16px;border:1.5px solid var(--border);border-radius:5px;flex:none;margin-top:2px}
/* ---------- write-ups ---------- */
.w-wrap{display:grid;grid-template-columns:360px minmax(0,1fr);gap:22px;margin-top:18px;min-height:0;flex:1}
.reader{padding:24px 30px}
.reader .meta{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text-2)}
.reader .pill{height:24px;padding:0 9px;border-radius:7px;border:1px solid var(--soft);background:var(--surface-2);display:inline-flex;align-items:center;gap:5px;font-size:12.5px}
.reader h2{margin:14px 0 14px;font-size:24px;letter-spacing:-.02em}
.tldr{padding:12px 14px;border-radius:10px;background:var(--surface-2);font-size:14px;color:var(--text-2)}
.reader h3{font-size:16px;margin:20px 0 8px}.reader ol{margin:0;padding-left:20px;color:var(--text-2);line-height:1.9}
.wl{display:flex;flex-direction:column;overflow:hidden;align-self:start}
.wl-h{padding:12px;display:flex;gap:8px;border-bottom:1px solid var(--soft)}
.wl-h .inp{flex:1}
.fbtn{width:38px;height:38px;border:1px solid var(--border);border-radius:10px;display:grid;place-items:center;color:var(--text-2);position:relative}
.fbtn em{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;background:var(--accent-bg);color:#fff;font:600 10px var(--font);display:grid;place-items:center;font-style:normal}
.wl-seg{display:flex;gap:2px;padding:10px 12px 0}
.wl-seg span{flex:1;text-align:center;height:30px;line-height:30px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text-2)}
.wl-seg span.on{background:var(--accent-soft);color:var(--accent)}
.wl-seg small{font:500 11px var(--mono);color:var(--text-3);margin-left:4px}
.wl-g{padding:12px 16px 6px;font-size:12px;font-weight:600;color:var(--text-3);display:flex;gap:6px;align-items:center}
.wl-g small{font:500 11px var(--mono)}
.wi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 16px;border-top:1px solid var(--soft);position:relative}
.wl-g+.wi{border-top:0}
.wi.on{background:var(--accent-soft)}.wi.on:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent-bg)}
.wi b{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wi .r{font-size:12.5px;color:var(--text-3);text-align:right;white-space:nowrap}
.wi .m{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-3)}
.wi .m .s{color:var(--green);display:inline-flex;align-items:center;gap:4px}
.wi .t{grid-column:1/-1;font-size:13px;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.wl-new{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--soft);color:var(--text-2);font-size:13.5px}
.e-wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:0;margin-top:18px;min-height:0;flex:1;overflow:hidden}
.e-side{border-right:1px solid var(--soft);background:var(--surface);display:flex;flex-direction:column}
.e-side .wl-h{border:0;padding:14px 14px 10px}
.e-cat{display:flex;align-items:center;gap:8px;padding:10px 16px 4px;font-size:13px;font-weight:600;color:var(--text)}
.e-cat small{margin-left:auto;font:500 11px var(--mono);color:var(--text-3)}
.e-it{padding:7px 16px 7px 32px;font-size:13.5px;color:var(--text-2);display:flex;gap:8px;justify-content:space-between}
.e-it em{font-style:normal;font:500 11.5px var(--mono);color:var(--text-3)}
.e-it.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.e-it.dim{color:var(--text-3)}
.e-r{padding:26px 40px;overflow:hidden;background:var(--surface)}
</style>
</head>
<body>
<div id="root"></div>
<script>
const I = (n, c='') => `<svg class="i ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${LUCIDE[n]||''}</svg>`;
const CATS = {osint:['OSINT','#8b5cf6','search'], forensics:['Forensics','#0ea5a4','hard-drive'], crypto:['Crypto','#eab308','key-round'], web:['Web','#3b82f6','globe'], stego:['Stego','#ec4899','image'], rev:['Reverse','#f97316','binary'], pwn:['Pwn','#ef4444','bug'], misc:['Misc','#64748b','box'], network:['Network','#06b6d4','network']};
const S = CTF_CHEATS.osint, groups = [...new Set(S.cmds.map(c => c[0]))];
const fill = cmd => cmd.replace(/\btarget(?!@)\b/g, '<b>192.168.1.5</b>').replace(/\b(file\.pdf|photo\.jpg)\b/g, '<b class="phv">$1</b>');
const shell = (inner, lbl, tab = 'cheats') => `<section class="frame"><nav class="rail"><div class="logo"></div>${['layout-dashboard','sticky-note','notebook-pen','graduation-cap'].map(i=>`<b>${I(i)}</b>`).join('')}<hr><b>${I('folder-open')}</b><hr>${['wrench','scan-search','binary','shield-check','cloud'].map(i=>`<b>${I(i)}</b>`).join('')}<b class="on">${I('flag')}</b><b>${I('book-open')}</b></nav>
  <div class="main"><div class="top"><div class="search">${I('search')}Search everything — cases, evidence, IOCs, tools, notes…</div><span class="sp"></span><button class="btn pri">${I('plus')}Capture</button></div>
  <div class="page"><div class="ph"><div><h1>CTF</h1><p>Solve challenges with a work log, keep write-ups, and have the right cheatsheet open while you work.</p></div><span class="sp"></span>${tab === 'writeups' ? `<button class="btn">${I('upload','sm')}Import Markdown</button><button class="btn">${I('download','sm')}Export all</button><button class="btn pri">${I('plus','sm')}New write-up</button>` : ''}</div>
  <nav class="tabs">${[['board','Challenges','flag',7],['writeups','Write-ups','scroll-text',2],['cheats','Cheatsheets','book-open',9],['first','First moves','list-checks',9]].map(([k,l,i,n]) => `<a class="${k === tab ? 'on' : ''}">${I(i,'sm')}${l}<small>${n}</small></a>`).join('')}</nav>
  ${inner}</div></div><div class="lbl">${lbl}</div></section>`;
const rows = (gs, hov) => gs.map(g => `<div class="gh">${g}<small>${S.cmds.filter(c => c[0] === g).length}</small></div>${S.cmds.filter(c => c[0] === g).map((c, i) => `<div class="row${hov && i === 1 && g === gs[0] ? ' hov' : ''}"><span>${c[1]}</span><code>${fill(c[2])}</code><span class="cp">${I('copy','sm')}</span></div>`).join('')}`).join('');
const fm = (n = 9) => `<ol>${S.first.slice(0, n).map(f => `<li><i></i><span>${f}</span></li>`).join('')}</ol>`;

/* A — one toolbar: category picker, search, values in a popover, first moves in a side drawer */
const A = shell(`
  <div class="a-bar"><span class="catpick"><span class="ic" style="--cc:#8b5cf6">${I('search','sm')}</span>OSINT <small>44</small>${I('chevron-down','sm')}</span>
    <div class="inp big" style="flex:1">${I('search','sm')}Search all 9 cheatsheets — steghide, ==, jwt, 89 50 4E 47, rop…<span class="sp"></span><kbd>/</kbd></div>
    <span class="vals" style="border-color:var(--accent-line)">${I('braces','sm')}Values <span class="tok">target 192.168.1.5</span><small>+0</small>${I('chevron-down','sm')}</span>
    <button class="btn" style="height:42px">${I('list-checks','sm')}<span class="drawer-tab">First moves <span class="pr"><i></i></span><span class="mono" style="font-size:12px;color:var(--text-3)">0/9</span></span></button></div>
  <div class="a-sub"><div class="ut"><span class="on">${I('terminal','sm')}Commands<small>24</small></span><span>${I('eye','sm')}Recognise it<small>20</small></span><span>${I('lightbulb','sm')}Gotchas<small>7</small></span></div><p>${S.blurb}</p></div>
  <div class="a-body"><nav class="toc"><div class="h">On this sheet</div><span class="on">All<small>24</small></span>${groups.map(g => `<span>${g}<small>${S.cmds.filter(c => c[0] === g).length}</small></span>`).join('')}</nav>
    <div class="card tbl">${rows(groups.slice(0, 5), true)}</div></div>
  <div class="pop" style="left:862px;top:300px"><h4>Your values</h4><p>Filled into every command as you type. Kept for this workspace.</p>
    <div class="f"><span>Target</span><div class="set">192.168.1.5</div><span>File</span><div>chal.bin</div><span>Wordlist</span><div>rockyou.txt</div><span>Your IP</span><div>$IP</div><span>Port</span><div>$PORT</div></div>
    <div class="ft"><span>1 of 5 set</span><button class="btn sm">Clear all</button></div></div>`,
  'A · One toolbar — values in a popover, groups as a side index');

/* B — reference tree: categories and their groups in one rail; values as a slim env line; first moves is a fourth tab */
const B = shell(`<div class="b-wrap">
  <nav class="card tree">${Object.entries(CATS).map(([k, [n]]) => k === 'osint'
    ? `<span class="c on">${I('chevron-down','sm')}${n}<small>44</small></span><div class="kids">${groups.map((g, i) => `<span class="${i === 1 ? 'on' : ''}">${g}<small>${S.cmds.filter(x => x[0] === g).length}</small></span>`).join('')}</div>`
    : `<span class="c">${I('chevron-right','sm')}${n}<small>44</small></span>`).join('')}</nav>
  <div class="b-main">
    <div class="b-head"><div class="inp big" style="flex:1">${I('search','sm')}Search all cheatsheets — steghide, ==, jwt, 89 50 4E 47, rop…<span class="sp"></span><kbd>/</kbd></div>
      <div class="ut" style="border:0;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px">${[['Commands',24,1],['Recognise it',20],['Gotchas',7],['First moves','0/9']].map(([l, n, on]) => `<span style="border:0;margin:0;height:36px;border-radius:9px;${on ? 'background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--border)' : ''}">${l}<small>${n}</small></span>`).join('')}</div></div>
    <div class="env">${I('braces','sm')}<span style="margin-right:4px">Fill in</span>${[['target','192.168.1.5',1],['file','chal.bin'],['wordlist','rockyou.txt'],['ip','$IP'],['port','$PORT']].map(([k, v, s]) => `<span class="k${s ? ' set' : ''}"><em>${k}</em><span>${v}</span></span>`).join('')}<span class="sp"></span><button class="btn sm" style="box-shadow:none;border:0;color:var(--text-3)">Clear</button></div>
    <div class="card tbl">${rows(groups.slice(1, 6), true)}</div></div></div>`,
  'B · Same tree as Reference — categories and groups in one list, values on one line');

/* C — printed cheatsheet: category tabs across, every group as its own card, first moves beside */
const C = shell(`
  <div class="c-bar"><div class="cats">${Object.entries(CATS).map(([k, [n, c]]) => `<span class="${k === 'osint' ? 'on' : ''}" style="--cc:${c}"><i></i>${n}</span>`).join('')}</div>
    <div class="inp" style="flex:1">${I('search','sm')}Search all cheatsheets…<span class="sp"></span><kbd>/</kbd></div></div>
  <div class="c-bar" style="margin-top:12px"><div class="ut" style="border:0">${[['Commands',24,1],['Recognise it',20],['Gotchas',7]].map(([l, n, on]) => `<span class="${on ? 'on' : ''}">${l}<small>${n}</small></span>`).join('')}</div><span class="sp"></span>
    <div class="env" style="border:0;background:none;padding:0">${[['target','192.168.1.5',1],['file','chal.bin'],['wordlist','rockyou.txt']].map(([k, v, s]) => `<span class="k${s ? ' set' : ''}"><em>${k}</em><span>${v}</span></span>`).join('')}<span style="font-size:12.5px">+2</span></div></div>
  <div class="c-grid"><div class="mas">${groups.slice(0, 8).map(g => `<div class="card gcard"><h5>${g}<small>${S.cmds.filter(c => c[0] === g).length}</small></h5>${S.cmds.filter(c => c[0] === g).map(c => `<div class="r"><span>${c[1]}</span><code>${fill(c[2])}</code></div>`).join('')}</div>`).join('')}</div>
    <div class="card fmc"><h4>${I('list-checks','sm')}First moves<small>0/9</small></h4>${fm(7)}</div></div>`,
  'C · Printed cheatsheet — every group is a card, two columns');

/* write-ups */
const W = [
  {t:'Rot in peace', c:'crypto', ev:'Sample CTF 2026', p:100, s:1, d:'2 d ago', tl:'The text was ROT13, and under it a base64 string. Two Decoder steps gave the flag.', on:1},
  {t:'Who registered it?', c:'osint', ev:'Sample CTF 2026', p:150, s:1, d:'2 d ago', tl:'Current WHOIS was redacted, but a historical record from before privacy was enabled showed the registrant e-mail.'},
  {t:'Leaky bucket', c:'web', ev:'HTB Uni 2026', p:300, s:0, d:'3 wk ago', tl:'An open S3 listing exposed a backup with the admin token.', src:'Imported'},
  {t:'Shadow over the pier', c:'osint', ev:'HTB Uni 2026', p:250, s:1, d:'3 wk ago', tl:'Sun angle and a bollard number placed the photo on one pier.'},
];
const reader = `<article class="card reader"><div class="meta"><span class="dot" style="--cc:#eab308"></span>Crypto<span class="pill">Sample CTF 2026</span><span class="pill">100 pts</span><span class="pill" style="color:var(--green)">${I('check','sm')}Solved</span><span class="sp"></span><button class="btn sm">${I('flag','sm')}Challenge</button><button class="btn sm">${I('pencil','sm')}Edit</button><button class="btn sm">${I('download','sm')}Markdown</button></div>
  <h2>Rot in peace</h2><div class="tldr"><b style="color:var(--text)">TL;DR</b> The text was ROT13, and under it a base64 string. Two Decoder steps gave the flag.</div>
  <h3>Steps</h3><ol><li><b style="color:var(--text)">Recognise the encoding.</b> Only letters, spaces and a {} pair in the right place: a Caesar shift.</li><li><b style="color:var(--text)">Undo ROT13.</b> The result ends in ==, which is base64 padding.</li><li><b style="color:var(--text)">Decode base64</b> to get the flag.</li></ol>
  <h3>Dead ends</h3><ul style="color:var(--text-2);padding-left:20px;margin:0"><li>Tried a Vigenère solver first; no key length stood out.</li></ul></article>`;
const wi = w => `<div class="wi${w.on ? ' on' : ''}"><b>${w.t}</b><span class="r">${w.d}</span><div class="m"><span class="dot" style="--cc:${CATS[w.c][1]}"></span>${CATS[w.c][0]} · ${w.p} pts${w.s ? ` · <span class="s">${I('check','sm')}Solved</span>` : ''}${w.src ? ' · ' + w.src : ''}</div><div class="t">${w.tl}</div></div>`;
const D = shell(`<div class="w-wrap"><div class="card wl">
    <div class="wl-h"><div class="inp">${I('search','sm')}Search write-ups…</div><span class="fbtn">${I('filter','sm')}</span></div>
    <div class="wl-seg"><span class="on">All<small>4</small></span><span>Mine<small>3</small></span><span>Imported<small>1</small></span></div>
    ${['Sample CTF 2026','HTB Uni 2026'].map(ev => `<div class="wl-g">${I('flag','sm')}${ev}<small>${W.filter(w => w.ev === ev).length}</small></div>${W.filter(w => w.ev === ev).map(wi).join('')}`).join('')}
    <div class="wl-new">${I('plus','sm')}New write-up</div></div>${reader}</div>`,
  'D · Write-ups — one clean list grouped by event', 'writeups');
const E = shell(`<div class="e-wrap card"><aside class="e-side">
    <div class="wl-h"><div class="inp">${I('search','sm')}Search write-ups…</div><span class="fbtn">${I('filter','sm')}</span></div>
    ${['crypto','osint','web'].map(c => `<div class="e-cat"><span class="dot" style="--cc:${CATS[c][1]}"></span>${CATS[c][0]}<small>${W.filter(w => w.c === c).length}</small></div>${W.filter(w => w.c === c).map(w => `<div class="e-it${w.on ? ' on' : ''}${w.s ? '' : ' dim'}"><span>${w.t}</span><em>${w.p}</em></div>`).join('')}`).join('')}
    <span class="sp"></span><div class="wl-new">${I('plus','sm')}New write-up</div></aside>
  <div class="e-r">${reader.replace('<article class="card reader">', '<article class="reader" style="padding:0">').replace('</article>', '')}</div></div>`,
  'E · Write-ups — a notebook: titles by category, the reader beside', 'writeups');

document.getElementById('root').innerHTML = A + B + C + D + E;
const theme = new URLSearchParams(location.search).get('theme'); if(theme) document.documentElement.dataset.theme = theme;
</script>
</body>
</html>
